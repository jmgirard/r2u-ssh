services:
  r2u-ssh:
    build: .
    image: ghcr.io/jmgirard/r2u-ssh:latest
    ports:
        - "127.0.0.1:${SSHPORT:-2222}:22"
    environment:
        - AUTHORIZED_KEYS_B64=${AUTHORIZED_KEYS_B64}
    volumes:
        - home:/home/rocker
        - ssh-host-keys:/etc/ssh/host_keys
volumes:
    home:
    ssh-host-keys:
