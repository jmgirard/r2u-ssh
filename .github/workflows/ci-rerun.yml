name: CI rerun on upstream outage

# Reruns a failed CI run once when test/smoke.sh reported that the r2u
# mirror or Posit's CDN did not answer from the runner. GitHub runs a
# workflow_run workflow only from the default branch's copy of this file.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun-upstream:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Rerun failed jobs if the log shows an upstream outage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: .github/scripts/ci-rerun.sh "$RUN_ID" "$CONCLUSION" "$ATTEMPT" "$BRANCH"
