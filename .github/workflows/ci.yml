name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'cairn/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < Dockerfile

      - name: Lint shell scripts (shellcheck)
        run: docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.11.0 /mnt/boot-sshd.sh /mnt/test/smoke.sh

      - name: Build image and run smoke test
        run: test/smoke.sh
