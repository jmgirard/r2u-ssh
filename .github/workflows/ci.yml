name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'cairn/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < Dockerfile

      - name: Lint shell scripts (shellcheck)
        run: docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.11.0 /mnt/boot-sshd.sh /mnt/test/smoke.sh /mnt/.github/scripts/ci-rerun.sh /mnt/test/ci-rerun.test.sh

      - name: Test the rerun decision script
        run: test/ci-rerun.test.sh

      - name: Build image and run smoke test
        env:
          # Authenticates the smoke test's Positron release lookup, so the
          # shared runner IP does not hit GitHub's anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: test/smoke.sh
